name: Build Nexora Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install SVG conversion utility
      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      # 5. Verify Android project exists
      - name: Verify project files
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            echo "Expected: app/src/main/AndroidManifest.xml"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper gradlew was not found."
            exit 1
          fi

      # 6. Copy the HTML application into Android assets
      - name: Prepare HTML assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      # 7. Extract SVG icon embedded in index.html
      - name: Extract embedded SVG icon
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          # Find the SVG whose opening tag contains id="app-icon".
          match = re.search(
              r'<svg\b(?=[^>]*\bid\s*=\s*["\']app-icon["\'])[^>]*>.*?</svg\s*>',
              html,
              re.IGNORECASE | re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: Could not find the app icon SVG.\n"
                  'Add id="app-icon" to the opening <svg> tag in index.html.'
              )

          svg = match.group(0)

          Path("/tmp/nexora-icon.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("SVG launcher icon extracted successfully.")
          PY

      # 8. Generate Android launcher icons
      - name: Generate launcher icon PNGs
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          rsvg-convert \
            -w 48 -h 48 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-mdpi/ic_launcher.png

          rsvg-convert \
            -w 72 -h 72 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-hdpi/ic_launcher.png

          rsvg-convert \
            -w 96 -h 96 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xhdpi/ic_launcher.png

          rsvg-convert \
            -w 144 -h 144 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          rsvg-convert \
            -w 192 -h 192 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Android launcher icons generated."

      # 9. Make Gradle wrapper executable
      - name: Configure Gradle
        run: |
          chmod +x ./gradlew

      # 10. Build debug APK
      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug

      # 11. Verify APK output
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo "Checking available APK files:"
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      # 12. Upload APK for download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
