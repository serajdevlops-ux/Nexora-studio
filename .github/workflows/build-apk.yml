name: Build Nexora Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html || {
            echo "ERROR: Root index.html not found."
            exit 1
          }

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/nexora/studio

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NexoraStudio"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexora.studio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexora.studio'
                  minSdk 23
                  targetSdk 30
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:label="Nexora Studio"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nexora/studio/MainActivity.java <<'EOF'
          package com.nexora.studio;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");

                  webView.postDelayed(this::requestAllFilesAccess, 700);
              }

              private void requestAllFilesAccess() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (Environment.isExternalStorageManager()) {
                          notifyPage(true);
                          return;
                      }

                      try {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION
                          );
                          startActivity(intent);
                      }
                  } else {
                      notifyPage(true);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.postDelayed(() -> {
                          boolean granted = Build.VERSION.SDK_INT < Build.VERSION_CODES.R
                              || Environment.isExternalStorageManager();
                          notifyPage(granted);
                      }, 300);
                  }
              }

              private void notifyPage(boolean granted) {
                  if (webView != null) {
                      webView.evaluateJavascript(
                          "window.dispatchEvent(new CustomEvent('nexora-file-access', {detail: {granted: "
                              + granted + "}}));",
                          null
                      );
                  }

                  if (granted) {
                      Toast.makeText(this, "File access enabled", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
