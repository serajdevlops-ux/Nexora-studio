name: Build Nexora Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project files
        run: |
          set -e
          if [ ! -f index.html ]; then
            echo "::error::index.html was not found in the repository root."
            exit 1
          fi

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/nexora/studio

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NexoraStudio"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexora.studio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexora.studio'
                  minSdk 23
                  targetSdk 30
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:label="Nexora Studio"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nexora/studio/MainActivity.java <<'EOF'
          package com.nexora.studio;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean permissionScreenOpened = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new NexoraBridge(), "NexoraAndroid");

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");

                  webView.postDelayed(this::requestAllFilesAccess, 800);
              }

              private void requestAllFilesAccess() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      dispatchPermissionState(true);
                      return;
                  }

                  if (Environment.isExternalStorageManager()) {
                      dispatchPermissionState(true);
                      return;
                  }

                  if (permissionScreenOpened) {
                      return;
                  }

                  permissionScreenOpened = true;

                  try {
                      Intent intent = new Intent(
                          Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          Uri.parse("package:" + getPackageName())
                      );
                      startActivity(intent);
                  } catch (Exception exception) {
                      try {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION
                          );
                          startActivity(intent);
                      } catch (Exception secondException) {
                          Toast.makeText(
                              this,
                              "Unable to open file access settings.",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.postDelayed(() -> {
                          boolean granted =
                              Build.VERSION.SDK_INT < Build.VERSION_CODES.R
                              || Environment.isExternalStorageManager();

                          dispatchPermissionState(granted);
                      }, 300);
                  }
              }

              private void dispatchPermissionState(boolean granted) {
                  if (webView != null) {
                      String script =
                          "window.dispatchEvent(new CustomEvent(" +
                          "'nexora-file-access',{detail:{granted:" +
                          granted + "}}));";

                      webView.evaluateJavascript(script, null);
                  }
              }

              private class NexoraBridge {
                  @JavascriptInterface
                  public boolean hasAllFilesAccess() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          return Environment.isExternalStorageManager();
                      }
                      return true;
                  }

                  @JavascriptInterface
                  public void requestAllFilesAccess() {
                      runOnUiThread(() -> {
                          permissionScreenOpened = false;
                          MainActivity.this.requestAllFilesAccess();
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("NexoraAndroid");
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK build did not produce $APK"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
