name: Build Nexora Studio APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Nexora Studio Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # ==========================================
      # 1. CHECK OUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALL JAVA
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. CONFIGURE ANDROID SDK
      # Do not use setup-android@v3.
      # It attempts to install the obsolete "tools"
      # package and fails on current SDK repositories.
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 4. INSTALL SVG CONVERTER
      # ==========================================
      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      # ==========================================
      # 5. CHECK APPLICATION SOURCE
      # ==========================================
      - name: Check application source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "::error::index.html is missing from the repository root."
            exit 1
          fi

          echo "Found Nexora Studio source."
          ls -lh index.html

      # ==========================================
      # 6. CREATE ANDROID PROJECT
      # ==========================================
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/nexora/studio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
          done

          cp index.html app/src/main/assets/index.html

          # Gradle project settings.
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NexoraStudio"
          include(":app")
          EOF

          # Root build configuration.
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # Android application configuration.
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexora.studio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexora.studio'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # Android manifest.
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Nexora Studio"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          # App name.
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Nexora Studio</string>
          </resources>
          EOF

          echo "Android project generated successfully."

      # ==========================================
      # 7. CREATE WEBVIEW ACTIVITY
      # ==========================================
      - name: Create Android WebView
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/nexora/studio/MainActivity.java <<'EOF'
          package com.nexora.studio;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  webView.setLayoutParams(
                      new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  webView.setBackgroundColor(Color.rgb(10, 12, 20));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);

                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      # ==========================================
      # 8. INSTALL GRADLE
      # ==========================================
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.9"

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      # ==========================================
      # 9. EXTRACT SVG FROM HTML
      # ==========================================
      - name: Extract Nexora SVG
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          pattern = (
              r'<svg\b'
              r'(?=[^>]*\bid\s*=\s*["\']app-icon["\'])'
              r'[^>]*>.*?</svg\s*>'
          )

          match = re.search(
              pattern,
              html,
              re.IGNORECASE | re.DOTALL
          )

          if match:
              svg = match.group(0)
              print("Found the embedded Nexora SVG icon.")
          else:
              print("No id=app-icon SVG found; using fallback icon.")

              svg = """<svg xmlns="http://www.w3.org/2000/svg"
                  width="512" height="512" viewBox="0 0 512 512">
                  <rect width="512" height="512" rx="112" fill="#0b1020"/>
                  <path d="M130 370 V142 L382 370 V142"
                    fill="none" stroke="#55e6ff" stroke-width="38"
                    stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M174 142 H338"
                    fill="none" stroke="#a78bfa" stroke-width="24"
                    stroke-linecap="round"/>
              </svg>"""

          Path("/tmp/nexora-icon.svg").write_text(
              svg,
              encoding="utf-8"
          )
          PY

      # ==========================================
      # 10. GENERATE LAUNCHER ICONS
      # ==========================================
      - name: Generate launcher icons
        shell: bash
        run: |
          set -euo pipefail

          rsvg-convert -w 48 -h 48 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-mdpi/ic_launcher.png

          rsvg-convert -w 72 -h 72 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-hdpi/ic_launcher.png

          rsvg-convert -w 96 -h 96 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xhdpi/ic_launcher.png

          rsvg-convert -w 144 -h 144 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          rsvg-convert -w 192 -h 192 \
            /tmp/nexora-icon.svg \
            -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Launcher icons generated."

      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build Nexora Studio APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK built successfully."
          ls -lh "$APK"

      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
