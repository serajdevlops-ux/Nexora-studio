name: Nexora Studio - Generate Project and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: nexora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Android Project and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ID: com.nexora.studio
      APP_NAME: Nexora Studio
      GRADLE_VERSION: "8.9"
      AGP_VERSION: "8.7.3"
      COMPILE_SDK: "35"

    steps:
      # -----------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify root index.html
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f index.html ]]; then
            echo "::error::Root index.html is missing."
            exit 1
          fi

          echo "Root index.html found."

      # -----------------------------------------------
      # 2. Install Java 17
      # -----------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------------------------
      # 3. Configure Android SDK
      # FIX: v4 does not request the removed "tools"
      # package.
      # -----------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Required Android SDK packages installed."

      # -----------------------------------------------
      # 4. Generate Android project files
      # -----------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            android/gradle/wrapper \
            android/app/src/main/java/com/nexora/studio \
            android/app/src/main/assets

          # Gradle wrapper properties.
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Gradle project settings.
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NexoraStudio"
          include(":app")
          EOF

          # Root Gradle build configuration.
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # Gradle properties.
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

          # Android application module.
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexora.studio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexora.studio'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                      versionNameSuffix '-debug'
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # Android manifest.
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Nexora Studio"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          # Java WebView activity.
          cat > android/app/src/main/java/com/nexora/studio/MainActivity.java <<'EOF'
          package com.nexora.studio;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          # Copy HTML without changing the repository root file.
          cp index.html android/app/src/main/assets/index.html

          # Generate project documentation.
          cat > android/README.md <<'EOF'
          # Nexora Studio Android

          This Android project is generated by GitHub Actions.

          Requirements:
          - Java 17
          - Android SDK 35
          - Gradle 8.9

          Build the debug APK with:

              ./gradlew assembleDebug

          The root repository index.html is copied into the Android
          assets directory when the project is generated.
          EOF

          echo "Android project files generated."

      # -----------------------------------------------
      # 5. Install Gradle
      # Gradle setup runs AFTER Gradle files exist.
      # -----------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Generate gradlew, gradlew.bat, and wrapper JAR.
      - name: Generate Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin

      # -----------------------------------------------
      # 6. Build APK
      # -----------------------------------------------
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # -----------------------------------------------
      # 7. Verify APK exists
      # -----------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK build succeeded."
          ls -lh "$APK"

      # -----------------------------------------------
      # 8. Upload APK
      # -----------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------
      # 9. Upload generated Android source
      # -----------------------------------------------
      - name: Upload generated Android source
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-android-source
          path: |
            android/README.md
            android/settings.gradle
            android/build.gradle
            android/gradle.properties
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build.gradle
            android/app/src/main/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
