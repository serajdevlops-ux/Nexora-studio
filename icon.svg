<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17132E"/>
      <stop offset="100%" stop-color="#080B16"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app background -->
  <rect width="512" height="512" rx="112" fill="url(#background)"/>

  <!-- Subtle circuit ring -->
  <circle
    cx="256"
    cy="256"
    r="151"
    fill="none"
    stroke="#8B5CF6"
    stroke-opacity="0.18"
    stroke-width="3"
  />

  <circle
    cx="256"
    cy="256"
    r="128"
    fill="none"
    stroke="#5EEAD4"
    stroke-opacity="0.12"
    stroke-width="2"
    stroke-dasharray="7 15"
  />

  <!-- Central Nexora N symbol -->
  <g
    fill="none"
    stroke="url(#neon)"
    stroke-width="29"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  >
    <path d="M165 337 V175 L347 337 V175"/>
  </g>

  <!-- Inner highlight -->
  <path
    d="M165 175 L347 337"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.28"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Neural nodes -->
  <g fill="#5EEAD4">
    <circle cx="165" cy="175" r="11"/>
    <circle cx="347" cy="337" r="11"/>
  </g>

  <g fill="#A78BFA">
    <circle cx="347" cy="175" r="11"/>
    <circle cx="165" cy="337" r="11"/>
  </g>

  <!-- Small connected nodes -->
  <g stroke="#5EEAD4" stroke-width="3" stroke-opacity="0.75">
    <path d="M165 175 L130 140"/>
    <path d="M347 337 L382 372"/>
    <path d="M347 175 L382 140"/>
    <path d="M165 337 L130 372"/>
  </g>

  <g fill="#5EEAD4">
    <circle cx="130" cy="140" r="6"/>
    <circle cx="382" cy="372" r="6"/>
  </g>

  <g fill="#A78BFA">
    <circle cx="382" cy="140" r="6"/>
    <circle cx="130" cy="372" r="6"/>
  </g>
</svg>
